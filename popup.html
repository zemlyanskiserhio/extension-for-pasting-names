<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add participants</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Add participants</h1>
    <p>Paste people separated by <b>;</b> or new lines. Outlook only searches after a real keystroke, so Chrome shows a debugging banner while this runs. Leave that banner alone until it finishes.</p>
  </header>

  <textarea id="names" rows="9" spellcheck="false" placeholder="Иванов Петр Сергеевич; Галкина Марина Викторовна; Василий Пушкин"></textarea>

  <div class="row">
    <label for="pause">Pause between people, ms</label>
    <input id="pause" type="number" min="200" max="5000" step="100" value="600">
    <span id="count">0 people</span>
  </div>

  <div class="buttons">
    <button id="start" type="button">Add one by one</button>
    <button id="stop" type="button" disabled>Stop</button>
  </div>

  <p id="status" class="status">Waiting for the meeting page.</p>
  <label id="problemLabel" hidden>Problematic names, ready to copy</label>
  <textarea id="problems" rows="4" readonly hidden spellcheck="false"></textarea>
  <ol id="log"></ol>
  <script src="popup.js"></script>
</body>
</html>
